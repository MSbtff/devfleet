name: Release

# Stages a release on npm when a version tag (v1.2.3) is pushed. A maintainer then
# approves it on npmjs.com with 2FA, and only then does the version become public.
# Uses npm Trusted Publishing (OIDC), so no npm token is stored anywhere, and npm
# attaches a provenance attestation that links the package to this run.
#
# Run it by hand (Actions → Release → Run workflow) to stage an existing tag again,
# for example after a failed run. The workflow file from the branch you run it on is
# used, but the package is built from the tag.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to stage, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    name: stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow run through OIDC
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      # Staged publishing needs npm 11.15.0 or newer.
      - run: npm install -g npm@11 && npm --version
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci # the prepare script builds dist/
      - run: npm run typecheck
      - run: npm test
      - run: npm stage publish
      - name: Next step
        run: echo "::notice::Staged $TAG. Approve it on npmjs.com (or run \`npm stage approve <stage-id>\`) to publish it."
