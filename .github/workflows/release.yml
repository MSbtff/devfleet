name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing version tag to stage, e.g. v0.2.0'
        required: true
        type: string

permissions:
  contents: read

jobs:
  stage:
    name: stage on npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: Check the tag name
        run: |
          if ! printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$TAG' is not a release tag like v1.2.3"
            exit 1
          fi
      - uses: actions/checkout@v5
        with:
          ref: refs/tags/${{ env.TAG }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm install -g npm@11 && npm --version
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$expected" ]; then
            echo "::error::Tag $TAG does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm stage publish
      - name: Next step
        run: echo "::notice::Staged $TAG. Approve it on npmjs.com (or run \`npm stage approve <stage-id>\`) to publish it."
