name: Release

# Publishes to npm when a version tag (v1.2.3) is pushed.
# Uses npm Trusted Publishing (OIDC), so no npm token is stored anywhere,
# and npm attaches a provenance attestation that links the package to this run.
on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  publish:
    name: publish to npm
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # lets npm verify this workflow run through OIDC
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      # Trusted Publishing needs npm 11.5.1 or newer.
      - run: npm install -g npm@11
      - name: Check that the tag matches package.json
        run: |
          expected="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_NAME" != "$expected" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $expected"
            exit 1
          fi
      - run: npm ci # the prepare script builds dist/
      # prepublishOnly runs typecheck and tests again before publishing.
      - run: npm publish
